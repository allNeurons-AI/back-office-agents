<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Trial balance details</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">This folder is already set up. What would you like to do?</label>
      <div class="elicit-pills" data-name="action" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Run now" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-player-play" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Run now</span><br><span style="font-size:11px; color:var(--text-muted)">Build today's workbook and send the email</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Fix column mapping" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-columns" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Fix column mapping</span><br><span style="font-size:11px; color:var(--text-muted)">My file headers changed or a source failed</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Edit settings" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-settings" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Edit settings</span><br><span style="font-size:11px; color:var(--text-muted)">Sources, paths, email, schedule</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Rebuild baseline" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-refresh" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Rebuild baseline</span><br><span style="font-size:11px; color:var(--text-muted)">Re-read the full history (after a restated month)</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Show status" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-info-circle" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Show status</span><br><span style="font-size:11px; color:var(--text-muted)">Last run, baseline month, next run</span></span>
        </button>
      </div>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
