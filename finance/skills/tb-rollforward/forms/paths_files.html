<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>SharePoint file details</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">How should I get to your SharePoint files?</label>
      <div class="elicit-pills" data-name="access_mode" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Synced folder" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-refresh" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Synced folder</span><br><span style="font-size:11px; color:var(--text-muted)">Library synced with OneDrive. Most reliable. Recommended</span></span>
        </button>
        <button type="button" class="elicit-pill" data-value="Microsoft 365 connector" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:200px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-plug-connected" style="font-size:20px" aria-hidden="true"></i>
          <span><span style="font-size:13px; font-weight:500">Microsoft 365 connector</span><br><span style="font-size:11px; color:var(--text-muted)">Download through the connector (needs it connected)</span></span>
        </button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Where are the ledger files? One folder or file path per line. Several are fine.</label>
      <textarea class="elicit-textarea" data-name="ledger_paths" placeholder="/Users/you/Library/CloudStorage/OneDrive-Company/Finance/GL"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Chart of accounts file(s)</label>
      <textarea class="elicit-textarea" data-name="accounts_paths" placeholder="path to the file or folder"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Entities (legal companies, their currency and parent) file(s)</label>
      <textarea class="elicit-textarea" data-name="entities_paths" placeholder="path to the file or folder"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Exchange rates file(s)</label>
      <textarea class="elicit-textarea" data-name="fx_paths" placeholder="path to the file or folder"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Month status file(s) (which months are closed). Leave empty if you do not have one.</label>
      <textarea class="elicit-textarea" data-name="periods_paths" placeholder="path to the file or folder, or leave empty"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">No month status file? Then tell me the last month that is closed (e.g. 2026-08).</label>
      <textarea class="elicit-textarea" data-name="closed_through" placeholder="YYYY-MM"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How are amounts signed in your ledger files?</label>
      <div class="elicit-pills" data-name="sign" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Debits positive, credits negative">Debits positive, credits negative</button>
        <button type="button" class="elicit-pill" data-value="Credits positive">Credits positive</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How are numbers written?</label>
      <div class="elicit-pills" data-name="decimal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="1,234.56">1,234.56</button>
        <button type="button" class="elicit-pill" data-value="1.234,56">1.234,56</button>
      </div>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
