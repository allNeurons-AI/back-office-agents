<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Email and schedule details</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">How should I email you the result?</label>
      <div class="elicit-pills" data-name="email_provider" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Gmail">Gmail</button>
        <button type="button" class="elicit-pill" data-value="Outlook">Outlook</button>
        <button type="button" class="elicit-pill" data-value="No email">No email</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Who should get the email? Separate addresses with commas.</label>
      <textarea class="elicit-textarea" data-name="email_to" placeholder="you@company.com"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Anyone to copy (optional)?</label>
      <textarea class="elicit-textarea" data-name="email_cc" placeholder="optional"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Show the headline totals inside the email?</label>
      <div class="elicit-pills" data-name="include_numbers" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes">Yes</button>
        <button type="button" class="elicit-pill" data-value="No">No</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Attach the Excel file to the email? (Gmail only. Outlook cannot attach files here, so the email carries a link instead)</label>
      <div class="elicit-pills" data-name="attach" data-multi="false">
        <button type="button" class="elicit-pill" data-value="No">No</button>
        <button type="button" class="elicit-pill" data-value="Yes">Yes</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Save each run's files to a cloud drive? I create a dated folder first, put every file inside it, and the email links to it.</label>
      <div class="elicit-pills" data-name="save_to_drive" data-multi="false">
        <button type="button" class="elicit-pill" data-value="No">No</button>
        <button type="button" class="elicit-pill" data-value="SharePoint / OneDrive">SharePoint / OneDrive</button>
        <button type="button" class="elicit-pill" data-value="Google Drive">Google Drive</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which drive folder should the dated folders go inside? (leave empty for the top level; skip if you said No above)</label>
      <textarea class="elicit-textarea" data-name="drive_parent" placeholder="e.g. Finance/Trial balance"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Send an email even when nothing changed since the last run?</label>
      <div class="elicit-pills" data-name="notify_no_change" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes">Yes</button>
        <button type="button" class="elicit-pill" data-value="No">No</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What time should the daily run happen (your computer's local time)?</label>
      <div class="elicit-pills" data-name="run_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="06:00">06:00</button>
        <button type="button" class="elicit-pill" data-value="07:00">07:00</button>
        <button type="button" class="elicit-pill" data-value="08:00">08:00</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="run_time" placeholder="Type it here" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which days?</label>
      <div class="elicit-pills" data-name="run_days" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Weekdays">Weekdays</button>
        <button type="button" class="elicit-pill" data-value="Every day">Every day</button>
      </div>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-submit">Save and schedule</button>
  </div>
</form>
