  <div class="elicit-header">

    <span>NetSuite details</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Which subsidiaries should be included? Type all, or list the internal ids separated by commas.</label>
      <textarea class="elicit-textarea" data-name="subsidiaries" placeholder="all"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which accounting book?</label>
      <div class="elicit-pills" data-name="accounting_book" data-multi="false">
        <button type="button" class="elicit-pill" data-value="1 (primary)">1 (primary)</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="accounting_book" placeholder="Type it here" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which subsidiary is the top-level (consolidation) one?</label>
      <div class="elicit-pills" data-name="root_subsidiary" data-multi="false">
        <button type="button" class="elicit-pill" data-value="1 (default)">1 (default)</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="root_subsidiary" placeholder="Type it here" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What is the first month with data in NetSuite (the history starts there)?</label>
      <textarea class="elicit-textarea" data-name="history_start" placeholder="YYYY-MM, e.g. 2023-01"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
