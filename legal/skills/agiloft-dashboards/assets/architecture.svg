<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" width="1560" height="600"
     font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <style>
      .n    { stroke-width:2; rx:8; ry:8; }
      .cap  { stroke-width:2; }
      .blue { fill:#dae8fc; stroke:#6c8ebf; }
      .grn  { fill:#d5e8d4; stroke:#82b366; }
      .org  { fill:#ffe6cc; stroke:#d79b00; }
      .yel  { fill:#fff2cc; stroke:#d6b656; }
      .pur  { fill:#e1d5e7; stroke:#9673a6; }
      .gry  { fill:#f5f5f5; stroke:#999; }
      .t    { fill:#000; font-size:15px; text-anchor:middle; }
      .s    { fill:#5a5a5a; font-size:11.5px; text-anchor:middle; }
      .e    { stroke:#000; stroke-width:1.7; fill:none; marker-end:url(#arw); }
      .d    { stroke-dasharray:6 4; }
      .lbl  { fill:#000; font-size:12px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1560" height="600" fill="#ffffff"/>

  <!-- ============ row A ============ -->
  <ellipse cx="140" cy="90" rx="100" ry="35" class="cap grn"/>
  <text class="t" x="140" y="95">Question in chat</text>

  <rect class="n blue" x="300" y="55" width="220" height="70"/>
  <text class="t" x="410" y="85">1. Detect tools</text>
  <text class="s" x="410" y="104">read tools only, never write</text>

  <rect class="n blue" x="580" y="55" width="240" height="70"/>
  <text class="t" x="700" y="85">2. Learn the schema</text>
  <text class="s" x="700" y="104">fields · statuses · types</text>

  <rect class="n blue" x="880" y="55" width="240" height="70"/>
  <text class="t" x="1000" y="85">3. Classify statuses</text>
  <text class="s" x="1000" y="104">by meaning, not string match</text>

  <path class="e" d="M240 90 H300"/>
  <path class="e" d="M520 90 H580"/>
  <path class="e" d="M820 90 H880"/>

  <!-- wrap from row A into row B -->
  <path class="e" d="M1000 125 V170 H20 V290 H40"/>

  <!-- ============ row B ============ -->
  <rect class="n org" x="40" y="255" width="220" height="70"/>
  <text class="t" x="150" y="285">4. Fetch &amp; count</text>
  <text class="s" x="150" y="304">one query per month</text>

  <path class="cap yel" d="M400 228 L500 290 L400 352 L300 290 Z"/>
  <text class="t" x="400" y="295">Full page?</text>

  <rect class="n pur" x="580" y="255" width="240" height="70"/>
  <text class="t" x="700" y="285">5. Split &amp; convert</text>
  <text class="s" x="700" y="304">entities · units · scope</text>

  <rect class="n blue" x="880" y="255" width="260" height="70"/>
  <text class="t" x="1010" y="285">6. Build all 4 tabs</text>
  <text class="s" x="1010" y="304">every time, not just one</text>

  <path class="e" d="M260 290 H300"/>
  <path class="e" d="M500 290 H580"/>
  <text class="lbl" x="540" y="278">No</text>
  <path class="e" d="M820 290 H880"/>

  <!-- refetch loop: a full page means records were missed -->
  <path class="e" d="M400 352 V400 H210 V325"/>
  <text class="lbl" x="308" y="420">Yes — records missed, refetch higher</text>

  <!-- ============ outputs ============ -->
  <rect class="n gry" x="1240" y="55" width="280" height="66"/>
  <text class="t" x="1380" y="85">Agiloft widget</text>
  <text class="s" x="1380" y="104">reconciled, not overwritten</text>

  <rect class="n grn" x="1240" y="165" width="280" height="70"/>
  <text class="t" x="1380" y="195">Answer + source</text>
  <text class="s" x="1380" y="214">table · fields · values</text>

  <rect class="n grn" x="1240" y="345" width="280" height="70"/>
  <text class="t" x="1380" y="375">Live dashboard</text>
  <text class="s" x="1380" y="394">source line on every panel</text>

  <path class="e" d="M1140 290 H1190 V200 H1240"/>
  <path class="e" d="M1190 290 V380 H1240"/>
  <path class="e d" d="M1380 165 V121"/>
  <text class="lbl" x="1462" y="147">if figures differ</text>

  <!-- ============ sources and follow-ups ============ -->
  <path class="cap gry" d="M50 446 a100 16 0 0 1 200 0 v78 a100 16 0 0 1 -200 0 z"/>
  <path d="M50 446 a100 16 0 0 0 200 0" fill="none" stroke="#999" stroke-width="2"/>
  <text class="t" x="150" y="500">Agiloft KB</text>
  <text class="s" x="150" y="552">read through the MCP connector</text>
  <text class="s" x="150" y="568">nothing hardcoded</text>
  <path class="e d" d="M100 438 V325"/>

  <rect class="n blue" x="880" y="470" width="260" height="66"/>
  <text class="t" x="1010" y="498">Follow-up question</text>
  <text class="s" x="1010" y="517">"just the NDAs"</text>
  <path class="e d" d="M1010 470 V325"/>
  <text class="lbl" x="1078" y="404">re-scopes the same page</text>
</svg>
